global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: nova-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend-api:8000"]
  - job_name: nova-kafka
    static_configs:
      - targets: ["kafka:9308"]
    metrics_path: /metrics
    scrape_interval: 30s
  - job_name: nova-mosquitto
    static_configs:
      - targets: ["mosquitto:9234"]
    scrape_interval: 30s
