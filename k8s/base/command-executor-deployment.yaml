apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-command-executor
  namespace: nova-gps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nova-command-executor
  template:
    metadata:
      labels:
        app: nova-command-executor
    spec:
      automountServiceAccountToken: false
      containers:
        - name: sandbox
          image: ghcr.io/novara-team/nova-gps-sandbox:latest
          command: ["sh", "-lc", "printf 'nova-sandbox-runner=ready\\n' && sleep 3600"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop: ["ALL"]
