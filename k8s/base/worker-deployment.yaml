apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-worker
  namespace: nova-gps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-worker
  template:
    metadata:
      labels:
        app: nova-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/novara-team/nova-gps-api:latest
          command: ["python", "kafka_consumer.py"]
          envFrom:
            - configMapRef:
                name: nova-gps-config
            - secretRef:
                name: nova-gps-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
