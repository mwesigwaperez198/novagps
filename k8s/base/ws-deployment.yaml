apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-kafka-to-ws
  namespace: nova-gps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nova-kafka-to-ws
  template:
    metadata:
      labels:
        app: nova-kafka-to-ws
    spec:
      containers:
        - name: kafka-to-ws
          image: ghcr.io/novara-team/nova-gps-api:latest
          command: ["python", "kafka_to_ws.py"]
          env:
            - name: WS_HOST
              value: 0.0.0.0
            - name: WS_PORT
              value: "8765"
          envFrom:
            - configMapRef:
                name: nova-gps-config
            - secretRef:
                name: nova-gps-secrets
          ports:
            - containerPort: 8765
              name: ws
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
