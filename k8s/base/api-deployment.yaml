apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova-api
  namespace: nova-gps
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nova-api
    spec:
      containers:
        - name: api
          image: ghcr.io/novara-team/nova-gps-api:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
          envFrom:
            - configMapRef:
                name: nova-gps-config
            - secretRef:
                name: nova-gps-secrets
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
