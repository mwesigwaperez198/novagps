apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nova-default-deny
  namespace: nova-gps
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nova-api-allow
  namespace: nova-gps
spec:
  podSelector:
    matchLabels:
      app: nova-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 9092
