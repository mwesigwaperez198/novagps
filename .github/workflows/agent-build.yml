name: nova-agent-android

on:
  push:
    branches: ["main"]
    paths: ["agent/android/**", ".github/workflows/agent-build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      # The repo ships a stub gradlew without gradle-wrapper.jar, so we
      # bootstrap the real wrapper from the setup-gradle toolchain before
      # invoking the build. This also makes local Android Studio happy.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate gradle wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Assemble debug APK
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-agent-debug
          path: agent/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
