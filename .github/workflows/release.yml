name: NOVA GPS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Backend tests
        run: |
          cd backend
          pip install -r requirements.txt
          pytest -q
      - name: Frontend tests + build
        run: |
          cd frontend
          npm install
          npm run build

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend && npm install
          cd ../electron && npm install
          pip install pyinstaller
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build backend binary
        run: python3 electron/build_backend.py --platform linux --skip-frontend --skip-electron
      - name: Copy frontend to electron
        run: cp -r frontend/dist electron/src
      - name: Build Electron AppImage
        run: cd electron && npx electron-builder --linux AppImage
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gps-linux
          path: electron/release/*.AppImage

  build-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend && npm install
          cd ../electron && npm install
          pip install pyinstaller
      - name: Build frontend
        run: cd frontend && npm run build
      - name: Build backend binary
        run: python3 electron/build_backend.py --platform mac --skip-frontend --skip-electron
      - name: Copy frontend to electron
        run: cp -r frontend/dist electron/src
      - name: Build Electron DMG
        run: cd electron && npx electron-builder --mac dmg --x64 --arm64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gps-mac
          path: electron/release/*.dmg

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend; npm install
          cd ../electron; npm install
          pip install pyinstaller
      - name: Build frontend
        run: cd frontend; npm run build
      - name: Build backend binary
        run: python electron/build_backend.py --platform win --skip-frontend --skip-electron
      - name: Copy frontend to electron
        run: xcopy /E /I frontend\dist electron\src
      - name: Build Electron installer
        run: cd electron; npx electron-builder --win nsis
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gps-windows
          path: electron/release/*.exe

  build-portable:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build portable bundle
        run: python3 scripts/build_portable.py
      - name: Zip portable
        run: cd build && zip -r nova-portable.zip nova-portable/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gps-portable
          path: build/nova-portable.zip

  build-iso:
    runs-on: ubuntu-latest
    needs: [test, build-portable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install live-build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq live-build debootstrap rsync squashfs-tools
      - name: Download portable artifact
        uses: actions/download-artifact@v4
        with:
          name: nova-gps-portable
          path: build/
      - name: Unzip portable
        run: cd build && unzip nova-portable.zip
      - name: Build ISO
        run: sudo ./livebuild/build.sh build/nova-portable
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-gps-iso
          path: livebuild/*.iso

  release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-mac, build-windows, build-portable, build-iso]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', inputs.version) }}
          name: "NOVA GPS ${{ github.ref_name || format('v{0}', inputs.version) }}"
          body: |
            ## NOVA GPS ${{ github.ref_name || format('v{0}', inputs.version) }}

            ### Downloads
            - **Linux AppImage** — `nova-gps-*.AppImage` (chmod +x, then run)
            - **macOS DMG** — `nova-gps-*.dmg` (drag to Applications)
            - **Windows Installer** — `nova-gps-setup.exe` (run installer)
            - **Portable Bundle** — `nova-portable.zip` (extract and run start_nova.sh/.bat/.command)
            - **Bootable USB ISO** — `nova-gps-live-amd64.hybrid.iso` (dd to USB stick)

            ### What's Included
            - Full GPS tracking platform (100+ API endpoints)
            - 18-panel desktop UI
            - OSINT + pentest tools (13 + 12 tools)
            - WiFi security, firmware analysis, vehicle recovery
            - Device fingerprinting, network discovery
            - Blockchain audit trail
            - Real-time 3D map
          files: artifacts/**/*
          draft: false
          prerelease: false
