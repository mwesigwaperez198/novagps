# NOVA GPS — Render Blueprint (single Web Service: FastAPI backend + dashboard UI).
# Deploys the repo-root Dockerfile (bundles backend + frontend/dist).
#
# Required manual step (set in the Render dashboard env once, then re-deploy):
#   SECRET_KEY        -> secure random, e.g. python3 -c "import secrets;print(secrets.token_hex(32))"
#   DEV_OWNER_EMAIL   -> your email; the ONLY account allowed to log in (dev allowlist).
#                        Set ENVIRONMENT=development to keep the allowlist behaviour,
#                        or production to also enable per-IP rate limiting.

services:
  - type: web
    name: nova-gps
    runtime: docker
    repo: https://github.com/mwesigwaperez198/novagps.git
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NOVA_MODE
        value: portable
      - key: ENVIRONMENT
        value: production
      # AUTO_ENROLL=1 lets any device with a configured identifier phone home and
      # self-register on first contact (device + consent auto-created). Keep for
      # the cross-device live test; set to 0/remove when you want strict manual
      # registration back.
      - key: AUTO_ENROLL
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/nova.sqlite3
      # NOVA-CORE embedded brain: downloads a small GGUF into /var/data/nova_vault/models
      # on first boot and runs llama.cpp in-process. Falls back to the deterministic
      # shield when the instance RAM cannot fit a model.
      - key: NOVA_EMBEDDED
        value: "1"
      - key: NOVA_LLM_BACKEND
        value: embedded
      - key: NOVA_AGENT_NAME
        value: LAU
      - key: SECRET_KEY
        sync: false
      - key: DEV_OWNER_EMAIL
        sync: false
      # Internal self-referencing keep-alive loop: the app pings its own public
      # health URL every KEEPALIVE_INTERVAL seconds (default 240) from a background
      # task, so Render never counts the service as idle / spins it down.
      - key: KEEPALIVE_URL
        value: https://novagps.onrender.com
      - key: KEEPALIVE_INTERVAL
        value: "240"
    disk:
      name: nova-gps-data
      mountPath: /var/data
      sizeGB: 10
