# NOVA GPS — Render Blueprint (single Web Service: FastAPI backend + dashboard UI).
# Deploys the repo-root Dockerfile (bundles backend + frontend/dist).
#
# Required manual step (set in the Render dashboard env once, then re-deploy):
#   SECRET_KEY        -> secure random, e.g. python3 -c "import secrets;print(secrets.token_hex(32))"
#   DEV_OWNER_EMAIL   -> your email; the ONLY account allowed to log in (dev allowlist).
#                        Set ENVIRONMENT=development to keep the allowlist behaviour,
#                        or production to also enable per-IP rate limiting.
#   OWNER_PASSWORD    -> the real password for the owner account. In production the
#                        login FAILS CLOSED until this is set, and the password is
#                        required even after the email allowlist matches.

services:
  - type: web
    name: nova-gps
    runtime: docker
    repo: https://github.com/mwesigwaperez198/novagps.git
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NOVA_MODE
        value: portable
      - key: ENVIRONMENT
        value: production
      - key: AUTO_ENROLL
        value: "1"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        value: sqlite:////var/data/nova.sqlite3
      # LAU embedded brain — llama.cpp runs in-process on the persistent disk.
      # Tuned for Render starter (512 MB RAM): smallest Q2_K model (~230 MB),
      # 512-token context, mmap enabled, 20s boot delay so health check passes
      # before the model download begins.
      - key: NOVA_EMBEDDED
        value: "0"
      - key: NOVA_LLM_BACKEND
        value: shield
      - key: NOVA_AGENT_NAME
        value: LAU
      - key: NOVA_EMBEDDED_CTX
        value: "512"
      - key: NOVA_EMBEDDED_TOKENS
        value: "128"
      - key: NOVA_EMBEDDED_THREADS
        value: "1"
      - key: NOVA_MEM_RESERVE_MB
        value: "128"
      - key: SECRET_KEY
        sync: false
      - key: DEV_OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      # Internal keep-alive: pings own /health every 240s so Render never idles
      # the service. GitHub Actions also pings every 5 min as external backup.
      - key: KEEPALIVE_URL
        value: https://novagps.onrender.com
      - key: KEEPALIVE_INTERVAL
        value: "240"
    disk:
      name: nova-gps-data
      mountPath: /var/data
      sizeGB: 10
